appId: com.nyx.authenticator
---
- launchApp
- assertVisible: "NYX"

# Inspect Sync Status Badge Pill
- assertVisible:
    id: "sync-status-pill"

# Tap Sync Pill to trigger manual synchronization
- tapOn:
    id: "sync-status-pill"

# Verify Synchronizing State
- assertVisible:
    text: "Syncing..."

# Verify completion back to Synced
- extendedWaitUntil:
    visible: "Synced"
    timeout: 10000

# Open Settings -> Enrolled Devices
- tapOn:
    id: "settings-button"
- assertVisible: "Enrolled Devices"
- tapOn: "Enrolled Devices"

# Verify current device badge
- assertVisible: "THIS DEVICE"
- tapOn: "Done"
